<title>Illumina Buy-Side Primer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: long-form research report. Sticky contents rail on wide screens, single column on phones.
   Evidence labels borrow the four sequencing-trace colours (A green, C blue, G amber, T red). */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#17212c; --muted:#596472; --rule:#d8dde4; --fill:#eef1f5;
  --accent:#1d5c86; --accent-soft:#e3edf5; --warn:#9a3b1e; --warn-soft:#f8ebe5; --good:#25704a; --good-soft:#e6f2ea;
  --baseA:#2f855a; --baseC:#2b6cb0; --baseG:#a86b12; --baseT:#b83228; --baseN:#5d6875;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#151c24; --ink:#e2e7ed; --muted:#9aa6b3; --rule:#2a3441; --fill:#1b2430;
  --accent:#74b4e2; --accent-soft:#18303f; --warn:#ef9a7a; --warn-soft:#3a2219; --good:#7fcf9f; --good-soft:#17301f;
  --baseA:#6fcf97; --baseC:#79aef0; --baseG:#e3b25c; --baseT:#f08a7f; --baseN:#a3aebb; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#151c24; --ink:#e2e7ed; --muted:#9aa6b3; --rule:#2a3441; --fill:#1b2430;
  --accent:#74b4e2; --accent-soft:#18303f; --warn:#ef9a7a; --warn-soft:#3a2219; --good:#7fcf9f; --good-soft:#17301f;
  --baseA:#6fcf97; --baseC:#79aef0; --baseG:#e3b25c; --baseT:#f08a7f; --baseN:#a3aebb; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.62;margin:0}
.page{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:28px 80px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px}
@media (max-width:980px){.page{grid-template-columns:minmax(0,1fr);gap:16px;padding-inline:16px}}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;font-size:13.5px;line-height:1.4;padding-right:6px}
nav.toc .tt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
nav.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
nav.toc a{color:var(--ink);text-decoration:none;display:flex;gap:8px}
nav.toc a span{font-family:var(--mono);color:var(--muted);min-width:22px;font-size:12px}
nav.toc a:hover{color:var(--accent)}
@media (max-width:980px){nav.toc{position:static;max-height:none;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:14px}}
main{min-width:0;max-width:820px}
header.mast{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:28px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,4.6vw,44px);line-height:1.08;margin:8px 0 10px;text-wrap:balance}
.dek{font-size:18px;color:var(--muted);max-width:68ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
section{scroll-margin-top:16px;margin-top:56px}
h2{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h2 .num{font-family:var(--mono);font-size:15px;color:var(--accent);font-weight:500;margin-right:10px;vertical-align:3px}
.lede{font-size:17.5px;color:var(--ink);margin:10px 0 18px}
h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.25;margin:34px 0 8px;text-wrap:balance}
h4{font-family:var(--sans);font-weight:700;font-size:15.5px;margin:24px 0 6px;letter-spacing:.01em}
p{margin:0 0 14px;max-width:72ch}
ul,ol{margin:0 0 16px;padding-left:22px;max-width:72ch}
li{margin:5px 0}
a{color:var(--accent)}
strong{font-weight:700}
.tbl{overflow-x:auto;margin:14px 0 8px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.4;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
thead th{background:var(--fill);font-weight:700;font-size:12.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.sub td{color:var(--muted);font-size:12.5px}
tr.tot td{font-weight:700;background:var(--fill)}
.src{font-size:12.5px;color:var(--muted);margin:4px 0 18px;max-width:none}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:500;line-height:1;padding:3px 5px 2px;border-radius:3px;border:1px solid currentColor;vertical-align:1px;white-space:nowrap}
.cD{color:var(--baseA)} .cDer{color:var(--baseC)} .cE{color:var(--baseG)} .cX{color:var(--baseT)} .cM{color:var(--baseN)} .cW{color:var(--baseN)} .cS{color:var(--baseC)}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin:18px 0}
.box .lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.box.ans{background:var(--accent-soft);border-color:transparent}
.box.var{background:var(--warn-soft);border-color:transparent}
.box.var .lab{color:var(--warn)}
.box.good{background:var(--good-soft);border-color:transparent}
.box.good .lab{color:var(--good)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;font-size:14px;margin:12px 0}
.legend div{display:flex;gap:8px;align-items:baseline}
dl.gloss{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:0;border-top:1px solid var(--rule);margin:10px 0 20px}
dl.gloss dt,dl.gloss dd{padding:8px 0;border-bottom:1px solid var(--rule);margin:0}
dl.gloss dt{font-weight:700;padding-right:14px}
@media (max-width:560px){dl.gloss{grid-template-columns:minmax(0,1fr)} dl.gloss dt{border-bottom:0;padding-bottom:0} }
.gh{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px}
.vlist{counter-reset:v;list-style:none;padding:0;max-width:none}
.vlist>li{counter-increment:v;position:relative;padding:14px 16px 14px 52px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);margin:10px 0}
.vlist>li::before{content:counter(v);position:absolute;left:14px;top:13px;font-family:var(--mono);font-size:14px;color:var(--warn);font-weight:500;width:26px;height:26px;border:1px solid var(--warn);border-radius:50%;display:flex;align-items:center;justify-content:center}
.vlist .dir{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.up{color:var(--good)} .down{color:var(--warn)}
.chart{margin:16px 0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .ttl{font-size:13px;font-weight:700;margin:0 0 6px}
.foot{margin-top:64px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
